# Adapted from the CI workflow kroryan contributed to the v2 line, which was
# written for the book_translator/ package layout this version does not have.
# What is kept: the three-OS matrix, the Python-version matrix, and the Bandit
# security scan. What is dropped: black and isort (this codebase is not
# black-formatted, so --check would fail every run and teach the team to ignore
# CI), the Windows .exe build and the Docker build (no .spec or Dockerfile
# here yet).
name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the launcher enforces and the README promises, so it
        # is tested rather than assumed. The floor is set by gliner, which ships
        # no 3.9 wheels — an older interpreter cannot install requirements.txt at
        # all. Every OS gets the current version, because the bugs that reach
        # users are path and encoding bugs.
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # No model calls, no Ollama, no network: the suite covers the half of
        # the pipeline that is decidable without a model.
        run: python -m pytest tests -q

      - name: Check that the app imports and the banner renders
        # The modules live in src/, which the server gets for free (Python puts
        # a script's own directory on the path) and pytest gets from
        # pyproject.toml. A bare `python -c` gets neither, so it is told here.
        env:
          PYTHONPATH: src
        run: python -c "import translator, banner; banner.print_terminal_banner()"

  lint:
    name: Errors and undefined names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.12.2
      # Which rules run is decided in pyproject.toml, not on this line, so a
      # local `ruff check` and this job cannot disagree about what passes.
      # Still only the checks that mean "this is broken", not the ones that
      # mean "this is not to my taste".
      - run: ruff check --output-format=github .

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install bandit
      # Reported, not blocking: this is a localhost tool, and the scanner's
      # findings need a person to read them.
      - run: bandit -r . -ll --exclude ./venv,./.venv,./tests || true
